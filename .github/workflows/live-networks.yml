name: Live Zcash network smoke
on:
  workflow_dispatch:
    inputs:
      origin:
        description: HTTPS deployment origin
        required: true
        default: https://veylens.vercel.app
permissions:
  contents: read
jobs:
  read-only-live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run build:core
      - name: Live mainnet + testnet signed collection
        env:
          VEYLENS_LIVE_ORIGIN: ${{ inputs.origin }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/check-live-networks.mjs --url "$VEYLENS_LIVE_ORIGIN"
