name: Render actual Veylens demo video
on:
  push:
    branches: [video/actual-app-zecathon-20261026]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Capture actual deployed interface and render video
        run: node scripts/render-zecathon-actual-app.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Veylens-Actual-App-Video
          path: |
            video-output/veylens-zecathon-actual-app.mp4
            video-output/*.png
          retention-days: 30
